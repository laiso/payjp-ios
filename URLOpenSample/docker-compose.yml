services:
  nginx:
    image: nginx:latest
    ports:
      - "3000:3000"
    volumes:
      - ./web_src:/var/www/app:cached
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:cached
    depends_on:
      - php
    networks:
      - internal-network-test
    working_dir: /var/www/app
  php:
    image: php:8.1-fpm
    volumes:
      - ./web_src:/var/www/app:cached
    networks:
      - internal-network-test
    working_dir: /var/www/app

networks:
  internal-network-test:
    driver: bridge
